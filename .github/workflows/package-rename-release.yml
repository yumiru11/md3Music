name: Package Rename Release Build

# 手动触发：只覆盖 applicationId，构建一个标准版 release APK。
# 关键约束（见 android/app/build.gradle.kts 的 md3ApplicationId）：
#   namespace / Kotlin 包路径 / MethodChannel 名一律保持不变。
#   内置 Rust 服务端 libkugou_server.so 只能靠 dlopen 加载，
#   且其 JNI 符号名固定在旧包名上，改 namespace 会直接打断本地服务。
on:
  workflow_dispatch:
    inputs:
      application_id:
        description: '产物包名 (applicationId)'
        required: true
        type: string
        default: 'com.zzyoxml.android.music'
      impeller:
        description: '渲染引擎：false=Skia（与官方手机版一致），true=Impeller'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: pkg-rename-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.application_id }} release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 持久化签名密钥：上游仓库 'keystore' release 里的 release.keystore
      # （PKCS12，alias=androiddebugkey，口令=android，有效期到 2056）。
      # 用它签名 → 每次构建签名一致、可覆盖升级，且与官方包同一签名。
      - name: Set up persistent signing keystore
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o android/app/release.keystore \
            https://github.com/zzyoxml/md3Music/releases/download/keystore/release.keystore
          cat > android/keystore.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=release.keystore
          EOF
          keytool -list -keystore android/app/release.keystore -storepass android | head -5

      - name: Flutter pub get
        run: flutter pub get

      - name: Read version from pubspec
        id: version
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          echo "name=${ver%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${ver##*+}" >> "$GITHUB_OUTPUT"

      - name: Flutter build APK (standard, release, arm64-v8a)
        run: |
          flutter build apk --release --flavor standard --split-per-abi --target-platform android-arm64 \
            --android-project-arg=md3ApplicationId=${{ inputs.application_id }} \
            --android-project-arg=md3EnableImpeller=${{ inputs.impeller }} \
            --dart-define=APP_VERSION=${{ steps.version.outputs.name }} \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }}

      - name: Verify APK
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-standard-release.apk"
          test -f "$apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          echo "=== badging ==="
          "$bt/aapt2" dump badging "$apk" | head -6
          test "$("$bt/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")" = "${{ inputs.application_id }}"
          test "$("$bt/aapt2" dump badging "$apk" | sed -n "s/^native-code: //p")" = "'arm64-v8a'"
          "$bt/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          # 组件类名必须仍是原 namespace：DEX 没改名，改了必然 ClassNotFound
          grep -q 'com.md3music.md3music.MainActivity' "$RUNNER_TEMP/manifest.txt"
          # FileProvider authority 必须跟随新包名（Kotlin 用 context.packageName 动态拼）
          grep -q '${{ inputs.application_id }}\.fileprovider' "$RUNNER_TEMP/manifest.txt"
          # extractNativeLibs=false：.so 必须未压缩，否则 dlopen 加载不到 → 内置服务端起不来
          unzip -v "$apk" | grep 'lib/arm64-v8a/libkugou_server.so' | grep -q 'Stored'
          echo "=== signature ==="
          "$bt/apksigner" verify --print-certs "$apk" | head -6
          "$bt/zipalign" -c -P 16 -v 4 "$apk" | tail -3
          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD3Music-${{ inputs.application_id }}-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-standard-release.apk
          if-no-files-found: error
          retention-days: 14
